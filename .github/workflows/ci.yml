name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.ruby == 'head' }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.0", "3.1", "3.2", "3.3", "3.4", "4.0", "head"]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  rails:
    name: Rails ${{ matrix.rails }} end-to-end (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # phlex-rails 2.x (used by the generated code) requires Ruby >= 3.2
        # and Rails >= 7.1, < 9.
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        rails: ["7.1", "7.2", "8.0", "8.1"]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Scaffold, convert and render a Rails ${{ matrix.rails }} app
        run: script/rails_e2e/run.sh "${{ matrix.rails }}" "$RUNNER_TEMP"
